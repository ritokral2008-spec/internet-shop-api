services:

  postgres:
    image: postgres:17
    container_name: internetshop-postgres

    environment:
      POSTGRES_DB: InternetShop
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d InternetShop"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: internetshop-api

    ports:
      - "8080:8080"

    environment:
      ASPNETCORE_ENVIRONMENT: Development

      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=InternetShop;Username=postgres;Password=postgres"

      Jwt__Key: "VeryLongSecretKeyForInternetShopDevelopment123456789"
      Jwt__Issuer: "InternetShop"
      Jwt__Audience: "InternetShopUsers"
      Jwt__ExpireMinutes: "60"

    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data: